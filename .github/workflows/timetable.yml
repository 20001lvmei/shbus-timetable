name: timetable

# 每 5 分钟抓一次上海 MaaS 的发车班次：
#   1) 合并进仓库里的 timetable.json（留档）
#   2) 通过 FTP 直接推到站点 htdocs/timetable.json（站点读本地文件，不依赖出网）
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch timetable
        run: node scripts/fetch-timetable.js

      - name: Commit to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update timetable $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Push to site via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            -T timetable.json \
            "ftp://${FTP_USER}:${FTP_PASS}@${FTP_SERVER}/htdocs/timetable.json"
          echo "uploaded to site"
